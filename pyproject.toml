[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantms-portal"
version = "0.1.0"
description = "Tooling for portal.quantms.org — index building, static web generation, and API"
requires-python = ">=3.10"
dependencies = [
    "qpx",
    "click>=8.1",
    "pyarrow>=14.0",
    "duckdb>=1.1.3",
    "boto3>=1.34",
    "s3fs>=2024.2",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=7.0", "ruff"]

[project.scripts]
quantms-portal = "quantms_portal.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantms_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring real QPX datasets",
]
