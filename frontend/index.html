    <link rel="canonical" href="https://portal.quantms.org/">
    <!-- Structured Data: DataCatalog -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DataCatalog",
      "name": "quantms Portal",
      "description": "Curated quantitative proteomics datasets reanalyzed with the quantms pipeline.",
      "url": "https://portal.quantms.org",
      "license": "https://creativecommons.org/licenses/by/4.0/",
      "provider": {
        "@type": "Organization",
        "name": "quantms project",
        "url": "https://quantms.org"
      },
      "dataset": [
        {
          "@type": "Dataset",
          "name": "Human Cancer Cell Lines",
          "url": "https://portal.quantms.org/collections/celllines",
          "description": "Human cancer cell-line proteomes reanalysed with quantms: the large ProCan (DIA), CCLE (TMT) and NCI-60 panels plus breast, gastric, Ewing sarcoma and timsTOF studies."
        },
        {
          "@type": "Dataset",
          "name": "MS-Net Peptide Identifications",
          "url": "https://portal.quantms.org/collections/msnet",
          "description": "Large-scale peptide identification across public proteomics datasets."
        },
        {
          "@type": "Dataset",
          "name": "Immunopeptidomics",
          "url": "https://portal.quantms.org/collections/immunopeptidomics",
          "description": "HLA-presented (non-tryptic) peptides; unspecific cleavage."
        }
      ]
    }
    </script>

  </head>
  <body>
    <div id="app"></div>
    <!-- GitHub Pages SPA redirect: restores route from 404.html query param -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
