    <!-- Structured Data: DataCatalog -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DataCatalog",
      "name": "quantms Portal",
      "description": "Curated quantitative proteomics datasets reanalyzed with the quantms pipeline. 251 datasets across 4 collections.",

      "license": "https://creativecommons.org/licenses/by/4.0/",
      "provider": {
        "@type": "Organization",
        "name": "quantms project",
        "url": "https://quantms.org"
      },
      "dataset": [
        {
          "@type": "Dataset",
          "name": "Absolute Protein Expression",
          "url": "https://portal.quantms.org/collections/absolute-expression",
          "description": "iBAQ-based absolute protein quantification across tissues and conditions. 103 datasets, 470,804 proteins, 18,053 samples."
        },
        {
          "@type": "Dataset",
          "name": "Differential Expression",
          "url": "https://portal.quantms.org/collections/differential-expression",
          "description": "Fold changes and statistical significance across disease vs. control conditions. 35 datasets, 162,915 proteins."
        },
        {
          "@type": "Dataset",
          "name": "MS-Net Peptide Identifications",

  <body>
    <div id="app"></div>
    <!-- GitHub Pages SPA redirect: restores route from 404.html query param -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
